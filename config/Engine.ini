[SystemSettings]
; 8-bit sRGB back buffer instead of UE5's 10-bit default (fixes washed-out / over-bright UI on D3DMetal)
r.DefaultBackBufferPixelFormat=0
; keep every HDR output path off
r.AllowHDR=0
r.HDR.EnableHDROutput=0
r.HDR.Display.OutputDevice=0
r.HDR.Display.ColorGamut=0
; suppress the "known issues with graphics driver" nag some UE builds show on D3DMetal
r.WarnOfBadDrivers=0
; FSR 3 frame interpolation on D3DMetal: run it on the graphics queue instead of async compute
; (flicker fix). r.FidelityFX.FI.UIMode: 0 = SlateRedraw (default), 1 = UIExtraction; try 1 if the HUD flickers.
r.FidelityFX.FI.AllowAsyncWorkloads=0
r.FidelityFX.FI.UpdateGlobalFrameTime=1
; === hitch reduction (added 2026-11-03) ===
; Unreal purges garbage on a timer (default about every 61 s), which is a classic once-or-twice-a-race
; stall. Spread the mark phase over frames and purge less often (32 GB unified memory can afford it).
gc.AllowIncrementalReachability=1
gc.AllowIncrementalGather=1
gc.IncrementalReachabilityTimeLimit=0.002
gc.IncrementalGatherTimeLimit=0.002
gc.TimeBetweenPurgingPendingKillObjects=300
gc.MultithreadedDestructionEnabled=1
; Compile recorded pipelines at startup in bigger batches instead of on first use in a race.
r.PSOPrecaching=1
r.PSOPrecache.ProxyCreationWhenPSOReady=1
r.ShaderPipelineCache.BatchSize=50
r.ShaderPipelineCache.BackgroundBatchSize=10
r.ShaderPipelineCache.PrecompileBatchTime=16
; Texture streaming: do not size the pool from the VRAM figure D3DMetal reports; use a generous fixed pool.
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.PoolSize=3000
