[SystemSettings]
; 8-bit sRGB back buffer instead of UE5's 10-bit default (fixes washed-out / over-bright UI on D3DMetal)
r.DefaultBackBufferPixelFormat=0
; keep every HDR output path off
r.AllowHDR=0
r.HDR.EnableHDROutput=0
r.HDR.Display.OutputDevice=0
r.HDR.Display.ColorGamut=0
; suppress the "known issues with graphics driver" nag some UE builds show on D3DMetal
r.WarnOfBadDrivers=0
; FSR 3 frame interpolation on D3DMetal: run it on the graphics queue instead of async compute
; (flicker fix). r.FidelityFX.FI.UIMode: 0 = SlateRedraw (default), 1 = UIExtraction; try 1 if the HUD flickers.
r.FidelityFX.FI.AllowAsyncWorkloads=0
r.FidelityFX.FI.UpdateGlobalFrameTime=1
