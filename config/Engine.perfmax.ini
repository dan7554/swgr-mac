[SystemSettings]
; === base (same as Engine.ini) ===
r.DefaultBackBufferPixelFormat=0
r.AllowHDR=0
r.HDR.EnableHDROutput=0
r.HDR.Display.OutputDevice=0
r.HDR.Display.ColorGamut=0
r.WarnOfBadDrivers=0
r.FidelityFX.FI.AllowAsyncWorkloads=0
r.FidelityFX.FI.UpdateGlobalFrameTime=1
; === perf: trim GPU work that does NOT shrink with the upscaler's render resolution ===
; The game is GPU-bound even at FSR Ultra Performance (1/3 res), so the cost is in
; fixed-size passes: virtual shadow map pages, volumetrics, Nanite raster, post.
; Virtual shadow maps: render shadow pages at a quarter of the default resolution.
r.Shadow.Virtual.ResolutionLodBiasDirectional=1.0
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
r.Shadow.Virtual.MaxPhysicalPages=2048
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=2
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2
; Nanite: rasterise at 2 pixels per edge instead of 1 (about half the cluster work).
r.Nanite.MaxPixelsPerEdge=2
; Volumetrics are evaluated on fixed-size froxel grids regardless of screen percentage.
r.VolumetricFog=0
r.VolumetricCloud=0
; Screen-space and distance-field extras.
r.SSR.Quality=0
r.DistanceFieldShadowing=0
r.DistanceFieldAO=0
r.AmbientOcclusionLevels=0
; Lumen (only matters if the game turns it on at this preset).
r.Lumen.Reflections.Allow=0
r.Lumen.TranslucencyReflections.FrontLayer.Allow=0
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=4
r.LumenScene.Radiosity=0
; Post-processing at output resolution.
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.LightShaftQuality=0
r.BloomQuality=2
r.SceneColorFringeQuality=0
r.MotionBlurQuality=0
r.RefractionQuality=0
r.SubsurfaceScattering=0
r.TranslucencyLightingVolumeDim=16
r.ParticleLightQuality=0
; === perfmax: disable virtual shadow maps; use cascaded shadow maps at a modest resolution ===
r.Shadow.Virtual.Enable=0
r.Shadow.MaxCSMResolution=1024
r.Shadow.MaxResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.6
r.Shadow.RadiusThreshold=0.06
; Fewer dynamic shadow casters and cheaper translucency
r.Shadow.CSMShadowDistanceFadeoutMultiplier=1.0
r.SkyLight.RealTimeReflectionCapture=0
